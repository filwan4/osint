[workspace]
members = [
  "crates/fieldwork-core",
  "crates/fieldwork-infrastructure",
  "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri = "2"
tauri-plugin-process = "2"
