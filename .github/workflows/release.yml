name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            librsvg2-bin \
            libayatana-appindicator3-dev \
            patchelf \
            libfuse2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify application and tag versions
        run: node scripts/check-version.mjs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Fieldwork ${{ github.ref_name }}"
          releaseBody: |
            ## Linux x86_64

            Download the Fieldwork AppImage below.

            ### CachyOS / Arch Linux
            The repository includes scripts/install-cachyos.sh, which installs runtime dependencies, verifies the AppImage SHA-256 digest, and adds Fieldwork to your application menu.

            In-app signed updates are not enabled yet. Re-run the installer to update.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
